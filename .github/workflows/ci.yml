name: CI

# CI runs on pull requests and on demand (workflow_dispatch) to conserve GitHub Actions credits.
# Run ./script/verify_all.sh locally before pushing.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Shells for the quoting tests
        # fish reads quoting differently from sh, bash and zsh; its round trips are skipped where it is missing.
        run: brew install fish
      - name: Build
        run: swift build
      - name: Test
        run: |
          swift test --filter RightHereCoreTests.
          swift test --filter RightHereKitTests.
          swift test --filter RightHereMCPTests.
          swift test --filter RightHereCLITests.
      - name: App and Finder extension build
        # Not part of the package: ad hoc signed, as script/verify_all.sh does it.
        run: |
          brew install xcodegen
          ./script/build_app.sh
      - name: Localization catalog
        run: |
          brew install uv
          uv run script/verify_localizations.py
          uv run script/verify_window_styles.py
      - name: Config schema
        run: uv run script/verify_config_schema.py
      - name: Embedded guides
        run: uv run script/compile_docs.py --check
      - name: "Documentation: commands and links"
        run: uv run script/verify_docs.py
      - name: Setup evaluation document
        run: uv run script/setup_evaluation.py check
      - name: Version
        run: uv run script/verify_version.py
      - name: Wording of macOS's own labels
        # Reads the names this runner's macOS ships for the Settings panes and two Finder menu items, and compares ours; it depends on the
        # macOS version, so it is not part of verify_all.sh. It does not fail the run: it says where a version differs.
        continue-on-error: true
        run: ./script/verify_macos_wording.py
      - name: Where this macOS keeps the names of the Settings panes
        continue-on-error: true
        run: ./script/verify_macos_wording.py --layout
      - name: Public safety
        run: ./script/verify_public_safety.sh
