name: CI

# CI runs on pull requests and on demand. Run ./script/verify_all.sh locally before pushing.
# Once the repository is public, a push trigger for main can be enabled by adding:
#   push:
#     branches: [main]
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Shells for the quoting tests
        # fish reads quoting differently from sh, bash and zsh; its round trips are skipped where it is missing.
        run: brew install fish
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: App and Finder extension build
        # Not part of the package: ad hoc signed, as script/verify_all.sh does it.
        run: |
          brew install xcodegen
          ./script/build_app.sh
      - name: Localization catalog
        run: |
          brew install uv
          uv run script/verify_localizations.py
      - name: Config schema
        run: uv run script/verify_config_schema.py
      - name: Embedded guides
        run: uv run script/compile_docs.py --check
      - name: "Documentation: commands and links"
        run: uv run script/verify_docs.py
      - name: Public safety
        run: ./script/verify_public_safety.sh
