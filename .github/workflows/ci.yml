name: CI

# macOS minutes are billed at ten times the rate on a private repository, so CI runs on pull
# requests and on demand, not on every push. Run ./script/verify_all.sh locally before pushing.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Localization catalog
        run: |
          brew install uv
          uv run script/verify_localizations.py
      - name: Config schema
        run: uv run script/verify_config_schema.py
      - name: Embedded guides
        run: uv run script/compile_docs.py --check
      - name: Public safety
        run: ./script/verify_public_safety.sh
