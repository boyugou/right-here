name: Feature request
description: An idea for an action, a setting, a terminal, an editor or an agent
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. `ROADMAP.md` lists what is planned and what is only an idea. A change that shapes the product gets a short decision
        record in `docs/decisions/` first, so the more you say about what you are trying to do, the better.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The thing you do now, by hand or with another tool, that Right Here could do from the Finder menu, `rh` or an AI agent.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Right Here to do?
      description: For example a menu entry, a config key, an action id (`rh actions` lists them), a terminal or an agent with its command line.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: A custom `[[app]]` or `[agent.<id>]` entry, a Quick Action of your own, a shell alias.
