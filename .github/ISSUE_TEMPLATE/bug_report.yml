name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not open an issue: see SECURITY.md.
        Please check `docs/TROUBLESHOOTING.md` first.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The action you ran (from Finder, `rh run ...` or an MCP call) and what it did instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rh doctor --report`
      description: Run `rh doctor --report` and paste its output as it is. It holds nothing your config says (names, commands, folders and the text of its errors are left out), and the home folder and the account name are removed.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Output of `sw_vers -productVersion` (Right Here needs macOS 26 or later on Apple silicon).
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and agent involved
      description: For example Ghostty 1.3.1 or Terminal.app, and Claude Code, Codex or none.
  - type: textarea
    id: config
    attributes:
      label: Relevant part of your config
      description: The `[[app]]`, `[agent.<id>]` or other section involved, if any.
      render: toml
